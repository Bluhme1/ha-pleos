name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test against Home Assistant Core
        run: >-
          docker run --rm --entrypoint sh
          -e COVERAGE_FILE=/tmp/.coverage
          -v "$GITHUB_WORKSPACE:/src:ro" -w /src
          ghcr.io/home-assistant/home-assistant:2026.10.1
          -c 'python -c "import json, subprocess, sys;
          subprocess.run([sys.executable, \"-m\", \"pip\", \"install\",
          *json.load(open(\"custom_components/pleos_vehicle_data/manifest.json\"))[\"requirements\"]], check=True)" &&
          python -m coverage run --branch --source=custom_components.pleos_vehicle_data
          -m unittest discover -s tests -v &&
          python -m coverage report --include="*/config_flow.py" --fail-under=100'
